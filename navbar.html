<!-- Navigation Bar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 py-3">
        <div class="flex items-center justify-between h-12">
        
            <!-- Logo/Name -->
            <div class="flex-shrink-0">
                <a href="index.html" class="text-xl font-bold text-slate-100 whitespace-nowrap hover:text-cyan-400 transition-colors">
                    Surrettun | <span class="text-cyan-400">Product Design</span>
                </a>
            </div>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex md:items-center md:space-x-6">
                <a href="service.html" class="text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-md font-medium transition-colors">
                    Services
                </a>
                <a href="index.html#projects" class="text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-md font-medium transition-colors">
                    Projects
                </a>
                <a href="index.html#about" class="text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-md font-medium transition-colors">
                    About
                </a>
                <a href="index.html#contact" class="text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-md font-medium transition-colors">
                    Contact
                </a>

                <!-- Desktop Share Button (Far Right Utility) -->
                <div class="pl-4 border-l border-slate-800">
                    <button id="share-btn" aria-label="Share page" title="Share Page / QR Code" class="p-2 text-slate-400 hover:text-cyan-400 hover:bg-slate-800/60 rounded-lg transition-colors focus:outline-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                        </svg>
                    </button>
                </div>
            </nav>

            <!-- Mobile Controls -->
            <div class="flex items-center gap-3 md:hidden">
                <!-- Mobile Share Button -->
                <button class="share-btn p-2 text-slate-400 hover:text-cyan-400 hover:bg-slate-800/60 rounded-lg transition-colors focus:outline-none" aria-label="Share page">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                    </svg>
                </button>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button" type="button" 
                        class="text-slate-400 hover:text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 p-2 rounded-md transition-colors"
                        aria-expanded="false" 
                        aria-controls="mobile-nav-menu">
                    
                    <svg id="icon-menu-open" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    
                    <svg id="icon-menu-close" class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Container -->
    <div id="mobile-nav-menu" class="md:hidden hidden border-t border-slate-800 bg-slate-900/98">
        <div class="px-2 pt-2 pb-3 space-y-1">
            <a href="service.html" class="block text-slate-300 hover:bg-slate-800 hover:text-cyan-400 rounded-md px-3 py-2 font-medium transition-colors">
                Services
            </a>
            <a href="index.html#projects" class="block text-slate-300 hover:bg-slate-800 hover:text-cyan-400 rounded-md px-3 py-2 font-medium transition-colors">
                Projects
            </a>
            <a href="index.html#about" class="block text-slate-300 hover:bg-slate-800 hover:text-cyan-400 rounded-md px-3 py-2 font-medium transition-colors">
                About
            </a>
            <a href="index.html#contact" class="block text-slate-300 hover:bg-slate-800 hover:text-cyan-400 rounded-md px-3 py-2 font-medium transition-colors">
                Contact
            </a>
        </div>
    </div>
</header>
