<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://surret.github.io/services.html">
    <meta property="og:title" content="Services & Capabilities | Surrettun Station">
    <meta property="og:description" content="Engineering capabilities, modular deliverables, toolchains, and project scoping.">
    <meta property="og:url" content="https://surret.github.io/services.html">
    <meta property="og:image" content="https://surret.github.io/img/Site-images/og-image.png">
    <meta property="og:type" content="webpage">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="img/Site-images/Surrettun-Station-Favicon-Logo.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="img/Site-images/Surrettun-Station-Favicon-Logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="img/Site-images/Surrettun-Station-Favicon-Logo.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="img/Site-images/Surrettun-Station-Favicon-Logo.png?v=2">

    <title>Services & Capabilities | Surrettun Station</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #f3f4f6;
            position: relative;
            min-height: 100vh;
        }

        /* Frozen Background Watermark */
        body::before {
            content: "";
            position: fixed;
            top: -50vh;
            left: -50vw;
            width: 200vw;
            height: 200vh;
            background-image: url('img/Site-images/Surrettun-Station-Socials-Logo.png');
            background-repeat: repeat;
            background-size: 140px auto;
            background-position: center;
            transform: rotate(-25deg);
            transform-origin: center center;
            opacity: 0.12;
            z-index: -10;
            pointer-events: none;
        }

        /* Utility class to hide scrollbars on mobile swipe tracks */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col overflow-x-hidden">

    <!-- Injected Navigation Header -->
    <div id="navbar-placeholder"></div>

    <!-- Main Container (pt-28 creates clearance under fixed navbar) -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16 overflow-x-hidden">

        <!-- Hero -->
        <section class="text-center max-w-3xl mx-auto mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-100 mb-3 tracking-tight">
                Engineering Capabilities & Scope
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">
                Select a module to review deliverables, tools, and verified proof of work.
            </p>
        </section>
        
        <!-- Dynamic Module Selector -->
        <section class="mb-8 w-full">
            <!-- Mobile View (< md): Clean Full-Width Dropdown (No Side-Scrolling) -->
            <div class="block md:hidden">
                <label for="mobile-module-select" class="block text-xs font-mono uppercase tracking-wider text-cyan-400 mb-2">
                    Select Capability Module
                </label>
                <div class="relative">
                    <select id="mobile-module-select" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm font-medium focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all appearance-none cursor-pointer">
                        <!-- Populated dynamically via module-filter.js -->
                    </select>
                    <!-- Custom Dropdown Arrow Icon -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                            <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Desktop View (>= md): 5-Column Button Grid -->
            <div id="module-cards-container" class="hidden md:grid md:grid-cols-5 gap-3">
                <!-- JS injects selector cards here for desktop -->
            </div>
        </section>

        <!-- Dynamic Active Module Display -->
        <section class="mb-16">
            <div id="module-detail-panel">
                <!-- JS injects active module details here -->
            </div>

            <!-- Matching Project Proof Grid -->
            <div class="mt-8 bg-slate-900/70 backdrop-blur-md border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-xs font-mono text-cyan-400 uppercase mb-4 tracking-wider">Verified Proof in Builds</h3>
                <div id="module-proof-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- JS injects matching project cards here -->
                </div>
            </div>
        </section>

        <!-- Dynamic Enquiry Form Container -->
        <section id="enquiry-form-container">
            <!-- enquiry-form.js injects the dynamic glassmorphic form shell here -->
        </section>

    </main>

    <!-- Data Files -->
    <script src="scripts/services-data.js"></script>
    <script src="scripts/card-shuffle.js"></script>
    <script src="scripts/project-controller.js"></script>

    <!-- UI Sandbox Components -->
    <script src="scripts/module-filter.js"></script>
    <script src="scripts/enquiry-form.js"></script>
    <script src="scripts/global-utilities.js"></script> 

    <!-- Sequential Initialisation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Render the form shell into #enquiry-form-container first
            if (window.renderEnquiryForm) {
                window.renderEnquiryForm('enquiry-form-container', {
                    title: 'Scope a Project',
                    subtitle: 'Select required engineering modules or submit custom project details.',
                    showModules: true,
                    buttonText: 'Submit Modular Enquiry'
                });
            }

            // 2. Initialise module selection tabs & checkbox syncing second
            if (window.initModuleFilter) {
                window.initModuleFilter();
            }
        });
    </script>
    
</body>
</html>
